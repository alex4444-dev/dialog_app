network:
  external_ip: "5.18.190.216"
  external_port: 8890
  min_port: 9000
  max_port: 10000
  max_port_attempts: 100
  bootstrap_nodes:
    - {"host": "5.18.190.216", "port": 8888}
    - {"host": "192.168.0.109", "port": 8888}
    - {"host": "192.168.0.105", "port": 8888}
  connection_timeout: 30


# НОВЫЕ СЕКЦИИ ДЛЯ ЗВОНКОВ:
media:
  # Аудио-кодек (например, Opus, PCMU)
  audio_codec: "opus"
  # Битрейт аудио в кбит/с
  audio_bitrate: 128
  # Частота дискретизации в Гц
  audio_sample_rate: 48000

# STUN/TURN серверы для установления P2P-соединения
  ice_servers:
    - {"urls": "stun:stun.l.google.com:19302"}
    - {"urls": "stun:stun1.l.google.com:19302"}
    - {"urls": "stun:stun.ya.ru:3478"}
    - {"urls": "stun:stun.calls.yandex.ru:3478"}
    - {"urls": "stun:stun.mail.ru:3478"}
    - {"urls": "turn:openrelay.metered.ca:80", "username": "openrelayproject", "credential": "openrelayproject"}
    # Альтернатива: для некоторых версий нужен порт 443
    - {"urls": "turn:openrelay.metered.ca:443", "username": "openrelayproject", "credential": "openrelayproject"}
    


# Внутренние порты для RTP/RTCP (аудио/видео потоков)
  rtp_port_range:
    min: 10000
    max: 20000

database:
  path: "./data/client.db"
  backup_interval: 3600

security:
  key_storage: "./data/keys/"
  session_duration: 86400

logging:
  level: "INFO"
  file: "./logs/client.log"