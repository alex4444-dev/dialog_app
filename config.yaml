network:
  min_port: 9000
  max_port: 10000
  max_port_attempts: 100
  bootstrap_nodes:                   # Эти узлы используются для начального входа в сеть (и для DHT, и для P2P)
    - {"host": "192.168.0.109", "port": 8888}
    - {"host": "192.168.0.105", "port": 8888}
  connection_timeout: 30

# ========== НОВАЯ СЕКЦИЯ DHT ==========
dht:
  enabled: true                      # Включить DHT-узел
  port: 9891                         # UDP порт для DHT (должен отличаться от listen_port)
  bootstrap_nodes:                   # Список DHT-бутстрап узлов (можно использовать те же, что и в network)
    - {"host": "router.bittorrent.com", "port": 6881}
    - {"host": "dht.transmissionbt.com", "port": 6881}
    - {"host": "router.utorrent.com", "port": 6881}
  refresh_interval: 3600             # Интервал перепубликации своего адреса (секунды)
  storage_ttl: 86400                 # Время жизни записи в DHT (секунды) – по умолчанию 24 часа

media:
  audio_codec: "opus"
  audio_bitrate: 128
  audio_sample_rate: 48000
  ice_servers:
    - {"urls": "stun:stun.l.google.com:19302"}
    - {"urls": "stun:stun1.l.google.com:19302"}
    - {"urls": "stun:stun.ya.ru:3478"}
    - {"urls": "stun:stun.calls.yandex.ru:3478"}
    - {"urls": "stun:stun.mail.ru:3478"}
    - {"urls": "turn:openrelay.metered.ca:80", "username": "openrelayproject", "credential": "openrelayproject"}
    - {"urls": "turn:openrelay.metered.ca:443", "username": "openrelayproject", "credential": "openrelayproject"}
  rtp_port_range:
    min: 10000
    max: 20000

database:
  path: "./data/client.db"
  backup_interval: 3600

security:
  key_storage: "./data/keys/"
  session_duration: 86400

logging:
  level: "INFO"
  file: "./logs/client.log"
